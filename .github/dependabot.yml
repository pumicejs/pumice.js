# Weekly update PRs, grouped so a normal week is one or two PRs. Security updates come
# separately, as soon as an advisory appears, and skip the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # A version must be out this long before it's proposed: freshly published packages
    # are where npm supply-chain attacks land.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the lowest Node line the package supports (engines: >=22), not the
      # newest; it moves when engines does.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript >=4.8.4 <6.1.0, and a newer TypeScript can't even
      # be installed next to it (ERESOLVE). Drop this once its peer range moves.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
