# Every pull request and every push to main, whatever it changes: a key pasted into a doc has
# leaked as much as one in the code. The repository is public.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # TruffleHog scans the commits a push or PR adds, so it needs the history.
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --results=verified,unknown
