# Publishes to npm when a version tag is pushed (docs/development/releasing.md): the tag must name
# package.json's version and a commit on main, the checks run again, and npm trusted publishing
# (OIDC, no stored token) publishes with provenance. Then the GitHub release, notes generated.
name: Release

on:
  push:
    tags: ["v*"]

# Releases go out one after the other, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The tag names package.json's version and a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG doesn't match package.json ($version)."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that isn't on main."
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: node .github/scripts/check-npm-version.mjs
      - run: npm ci
      # prepublishOnly builds dist/.
      - run: npm publish --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
