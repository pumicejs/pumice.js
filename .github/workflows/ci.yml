# Every pull request and every push to main runs the whole check, on both Node LTS lines the
# package supports (engines: >=22). How to run the same locally: docs/development/testing.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # main's check by hand, for a push GitHub lost and ran nothing for.
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # npm's download cache only; node_modules is installed fresh by `npm ci` every run.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Includes the contract test: fixtures/contract/ must match what the contract app serves.
      - run: npm test
      - run: npm run build
      # Production dependencies only, so the audit means something (dev tools aren't shipped).
      - run: npm audit --omit=dev --audit-level=high
      # The tarball holds dist/, README, LICENSE and package.json, nothing else.
      - name: Check the package contents
        run: node .github/scripts/check-pack.mjs
